name: quiztion
description: "Aplicativo de estudos por quizzes de múltipla escolha gerados por IA."
publish_to: "none"
version: 0.1.0+1

environment:
  # Requer Flutter >= 3.27 (Dart >= 3.6) por causa de Color.withValues.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado
  provider: ^6.1.2

  # Navegação
  go_router: ^14.2.0

  # Armazenamento local (SQLite tipado)
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Suporte a web (drift)
  drift_flutter: ^0.1.0

  # Formatação de datas
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Geração de código do drift
  drift_dev: ^2.19.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
